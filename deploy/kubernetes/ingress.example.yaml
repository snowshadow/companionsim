# Apply only after the ingress host and certificate are configured.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sim-eval-ui
  namespace: example
  annotations:
    alb.ingress.kubernetes.io/ssl-redirect: 'true'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
spec:
  ingressClassName: alb
  tls:
    - hosts: [sim.example.com]
  rules:
    - host: sim.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sim-eval-ui
                port: {number: 80}
